<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Three Body</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: rgba(20, 24, 33, 0.88);
      --text: #d8dee9;
      --muted: #8b95a7;
      --accent: #4a90e2;
      --line: #2a3140;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
    #view { position: fixed; inset: 0; }
    #panel { position: fixed; top: 12px; left: 12px; width: 290px; max-height: calc(100% - 24px);
      overflow-y: auto; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; backdrop-filter: blur(6px); }
    h1 { margin: 0 0 2px; font-size: 17px; font-weight: 600; }
    .about { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; min-height: 2.8em; }
    label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.04em; }
    select, button { font: inherit; color: var(--text); background: #1b2130; border: 1px solid var(--line);
      border-radius: 6px; padding: 6px 10px; cursor: pointer; }
    select { width: 100%; }
    button:hover, select:hover { border-color: var(--accent); }
    .row { display: flex; gap: 6px; align-items: center; }
    .row button { flex: 1; }
    input[type=range] { flex: 1; accent-color: var(--accent); }
    .value { width: 52px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
    .check { display: flex; gap: 8px; align-items: center; margin-top: 10px; color: var(--text);
      text-transform: none; letter-spacing: 0; font-size: 13px; }
    #bodies { margin: 12px 0 0; padding: 0; list-style: none; font-size: 13px; }
    #bodies li { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    #readout { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
      font-variant-numeric: tabular-nums; font-size: 13px; }
    #readout div { display: flex; justify-content: space-between; }
    #readout span:first-child { color: var(--muted); }
    #status { margin-top: 8px; min-height: 1.4em; font-size: 13px; }
    #status.alert { color: #ff6b6b; font-weight: 600; }
    .hint { margin-top: 10px; color: var(--muted); font-size: 12px; }
    @media (max-width: 600px) {
      #panel { width: auto; left: 8px; right: 8px; top: auto; bottom: 8px; max-height: 45%; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="view"></div>
  <div id="panel">
    <h1>Three Body</h1>
    <p class="about" id="about"></p>

    <label for="preset">Preset</label>
    <select id="preset"></select>

    <div class="row" style="margin-top: 10px">
      <button id="play">Pause</button>
      <button id="reset">Reset</button>
    </div>

    <label for="speed">Speed</label>
    <div class="row">
      <input id="speed" type="range" min="-1" max="1" step="0.05" value="0">
      <span class="value" id="speed-value">1.0×</span>
    </div>

    <label for="trail">Trail length</label>
    <div class="row">
      <input id="trail" type="range" min="0" max="5000" step="100" value="1500">
      <span class="value" id="trail-value">1500</span>
    </div>

    <label>Camera</label>
    <div class="row">
      <button id="view-angle">Tilted</button>
      <button id="view-top">Top</button>
      <button id="view-side">Side</button>
    </div>

    <label class="check"><input id="true-size" type="checkbox"> True body sizes</label>

    <ul id="bodies"></ul>

    <div id="readout">
      <div><span>Time</span><span id="time">0</span></div>
      <div><span>Energy error</span><span id="energy">0</span></div>
    </div>
    <div id="status"></div>
    <div class="hint">Drag to rotate · scroll to zoom · right-drag to pan · space to pause</div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
