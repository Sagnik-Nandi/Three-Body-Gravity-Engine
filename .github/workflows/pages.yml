# Publish the 3D web view (web/) to GitHub Pages on every push to main.
# The JS tests must pass first. One-time setup in the repo on GitHub:
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy web view to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also allow running it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run JS tests
        working-directory: web
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Collect the page's files
        # Only what the browser needs; serve.js and the tests stay out.
        run: |
          mkdir _site
          cp web/index.html web/main.js web/engine.js web/particles.js web/scenarios.js web/tour.js _site/
      - name: Stamp the version and make old cached scripts unusable
        # Browsers may cache scripts for 10 minutes. Adding ?v=<commit> to every
        # script address means a new page always loads the matching new scripts
        # (never an old main.js with a new index.html), and shows its version.
        run: |
          v="${GITHUB_SHA::7}"
          cd _site
          sed -i "s|src=\"main.js\"|src=\"main.js?v=$v\"|; s|>local</span>|>$v</span>|" index.html
          sed -i "s|from \"\./\([a-z]*\)\.js\"|from \"./\1.js?v=$v\"|" main.js scenarios.js particles.js
          grep -o 'main.js?v=[a-f0-9]*' index.html
          grep -ho 'from "\./[a-z]*\.js?v=[a-f0-9]*"' main.js scenarios.js particles.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
